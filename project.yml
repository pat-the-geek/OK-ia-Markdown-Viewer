name: OK-ia - md Viewer

options:
  bundleIdPrefix: ch.ok-ia
  deploymentTarget:
    iOS: "26.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # Localizable.xcstrings is authored in French and translated to en/de/es/it.
  # Both keys are needed: without knownRegions, only en.lproj is compiled from the
  # catalogue and the App Store lists a single language.
  developmentLanguage: fr
  knownRegions: [Base, fr, en, de, es, it]

settings:
  base:
    MARKETING_VERSION: "1.2"
    CURRENT_PROJECT_VERSION: "34"
    DEVELOPMENT_TEAM: "PU9BSXN2V5"      # Paid Apple Developer Program team (auto-signing) — used for TestFlight/App Store.
                                        # (Build 14 and the store provisioning profile are under this team;
                                        #  72NVM63N83 was the cert-name suffix, not the team id.)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  OKiaMarkdownViewer:
    type: application
    platform: iOS
    deploymentTarget: "26.4"
    sources:
      # Swift source + asset catalog (Web folder excluded — added as a folder reference below)
      - path: OKiaMarkdownViewer
        excludes:
          - "Web/**"
          - "Samples/**"
      # Folder references: copied verbatim into the bundle so relative paths (vendor/, fonts/) are preserved.
      - path: OKiaMarkdownViewer/Web
        type: folder
      - path: OKiaMarkdownViewer/Samples
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.ok-ia.markdownviewer
        PRODUCT_NAME: md Viewer          # built app / executable name (display name lives in Info.plist)
        INFOPLIST_FILE: OKiaMarkdownViewer/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        SUPPORTS_MACCATALYST: YES                    # macOS via Mac Catalyst
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO    # true Catalyst app (not "Designed for iPad")
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO  # same bundle id on Mac
        # 26.4 partout depuis la 1.2, et c'est le framework qui l'impose. `Translation`
        # n'existe sur Mac Catalyst qu'à partir de macCatalyst 26.0, et ses deux pièces
        # décisives — `skipsTranslation` et la traduction d'un `AttributedString` — qu'à
        # partir de 26.4. En deçà, il restait un chemin de repli qui traduisait moins bien :
        # un seul morceau par bloc, le reste laissé en langue d'origine. Viser 26.4 rend ce
        # chemin inutile et ne laisse qu'un comportement, celui qui a été éprouvé.
        MACOSX_DEPLOYMENT_TARGET: "26.4"
        # Les deux clés sont nécessaires, et c'est la seconde qui décide. Sur Catalyst, Xcode
        # dérive LSMinimumSystemVersion — et la disponibilité vue par le compilateur — de la
        # cible iOS, pas de MACOSX_DEPLOYMENT_TARGET : sans cette ligne, l'app se déclarait
        # encore macOS 14.0 alors que tout le reste était en place.
        IPHONEOS_DEPLOYMENT_TARGET[sdk=macosx*]: "26.4"
        # NOTE: local Mac run used CODE_SIGN_IDENTITY[sdk=macosx*]: "-" (ad-hoc); temporarily
        # removed for Mac App Store distribution archive (automatic signing picks Apple Distribution).
        # App Sandbox entitlements (mandatory for the Mac App Store) — macOS/Catalyst only, iOS untouched.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: OKiaMarkdownViewer/macOS.entitlements
        GENERATE_INFOPLIST_FILE: NO

# Scheme named "md Viewer" so archives are filed under that name in the Organizer
# (the archive's Name = scheme name). The target keeps its internal id.
schemes:
  md Viewer:
    build:
      targets:
        OKiaMarkdownViewer: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
      revealInOrganizer: true
