name: TranslationBench

options:
  bundleIdPrefix: ch.ok-ia
  deploymentTarget:
    iOS: "26.4"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "PU9BSXN2V5"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"

targets:
  TranslationBench:
    type: application
    platform: iOS
    deploymentTarget: "26.4"
    sources:
      - path: TranslationBench
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.ok-ia.translationbench
        PRODUCT_NAME: TranslationBench
        INFOPLIST_FILE: TranslationBench/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        MACOSX_DEPLOYMENT_TARGET: "26.4"
        CODE_SIGN_IDENTITY[sdk=macosx*]: "-"
        GENERATE_INFOPLIST_FILE: NO
